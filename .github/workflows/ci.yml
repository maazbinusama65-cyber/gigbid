name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu torch && pip install -e ".[dev]"
      - run: ruff check .
      - run: python scripts/ci_rules.py
      - name: unit + integration + contract (stub LLM, no network)
        run: pytest -q
        env: {MODEL_PROFILE: stub}
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu torch && pip install -e ".[dev]"
      - run: cd apps/web && npm ci && npx playwright install --with-deps chromium
      - run: cd apps/web && npm run build && npx playwright test
        env: {GIGBID_SERVICES: mock}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: playwright-report, path: apps/web/playwright-report}
